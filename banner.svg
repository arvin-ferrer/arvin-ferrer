<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#313244"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#fade)"/>
  <rect width="900" height="220" fill="url(#dots)" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="220" fill="#cba6f7"/>

  <!-- Top-right decorative circles (like a terminal toolbar) -->
  <circle cx="856" cy="32" r="9" fill="#f38ba8" opacity="0.85"/>
  <circle cx="832" cy="32" r="9" fill="#f9e2af" opacity="0.85"/>
  <circle cx="808" cy="32" r="9" fill="#a6e3a1" opacity="0.85"/>

  <!-- Terminal top bar -->
  <rect x="0" y="0" width="900" height="52" fill="#11111b" opacity="0.6"/>
  <text x="24" y="33" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="13" fill="#585b70">arvin@github:~$</text>
  <text x="152" y="33" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="13" fill="#a6e3a1">cat profile.md</text>

  <!-- Name -->
  <text x="36" y="118" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="52" font-weight="bold" fill="#cba6f7">Arvin Ferrer</text>

  <!-- Subtitle row -->
  <text x="40" y="152" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="15" fill="#89b4fa">CS student @ UPLB</text>
  <text x="148" y="152" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="15" fill="#45475a">  //  </text>
  <text x="192" y="152" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="15" fill="#94e2d5">Dost-sei scholar</text>
  <text x="354" y="152" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="15" fill="#45475a">  //  </text>
  <text x="398" y="152" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="15" fill="#fab387">Aspiring Software Engineer| Data Scientist</text>

  <!-- Bottom divider -->
  <rect x="36" y="190" width="828" height="1" fill="#313244"/>

  <!-- Decorative tag line -->
  <text x="36" y="210" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="11" fill="#45475a">Nice to meet you!</text>
</svg>
